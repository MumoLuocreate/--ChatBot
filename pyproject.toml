[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qichi"
version = "0.1.0"
description = "Qichi companion application"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "PyYAML>=6.0",
    "tokenizers>=0.23,<0.24",
    "tzdata>=2025.2",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]
# 离线语音调参工具用（基频筛选 take）；运行时不 import，见
# 历史TTS计划 §2.24。用户 2026-09-14 批准加入。
voice-tools = [
    "numpy>=2.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
